global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: app-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          stream_mode: live

  - job_name: app-consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
        labels:
          stream_mode: live

  - job_name: app-api-replay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8082
        labels:
          stream_mode: replay

  - job_name: app-consumer-replay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8083
        labels:
          stream_mode: replay

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
