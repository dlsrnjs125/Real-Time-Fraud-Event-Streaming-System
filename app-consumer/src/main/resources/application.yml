spring:
  application:
    name: app-consumer
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-event-consumer
      enable-auto-commit: false
      auto-offset-reset: earliest
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud
    username: fraud
    password: fraud
    hikari:
      maximum-pool-size: ${CONSUMER_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${CONSUMER_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${CONSUMER_DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms

fraud:
  sliding-window:
    window: 5m
    max-events: 5
    amount-threshold: 3000000
    ttl: 10m

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        fraud.kafka.queue.latency: true
        fraud.consumer.processing.latency: true
        fraud.redis.window.latency: true
        fraud.rule.processing.latency: true
        fraud.db.persistence.latency: true
        fraud.event.e2e.latency: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        fraud.kafka.queue.latency: 0.5,0.95,0.99
        fraud.consumer.processing.latency: 0.5,0.95,0.99
        fraud.redis.window.latency: 0.5,0.95,0.99
        fraud.rule.processing.latency: 0.5,0.95,0.99
        fraud.db.persistence.latency: 0.5,0.95,0.99
        fraud.event.e2e.latency: 0.5,0.95,0.99
